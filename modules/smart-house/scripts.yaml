# Declarative scripts, included from default.nix.
# Scripts are a mapping keyed by script id, not a list.
digital_clock_low_siren:
  alias: Digital Clock Low Siren
  sequence:
    - action: switch.turn_on
      target:
        entity_id: switch.sonoff_snzb_09p_alarm_light_enable
    - action: switch.turn_on
      target:
        entity_id: switch.sonoff_snzb_09p_alarm_sound_enable
    - action: select.select_option
      target:
        entity_id: select.sonoff_snzb_09p_alarm_sound_type
      data:
        option: Chime Electronic Clock
    - action: select.select_option
      target:
        entity_id: select.sonoff_snzb_09p_alarm_volume_level
      data:
        option: LOW
    - action: switch.turn_on
      target:
        entity_id: switch.sonoff_snzb_09p_siren_on
