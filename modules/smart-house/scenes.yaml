# Declarative scenes, included from default.nix.
# HA parses YAML 1.1, so quote "on"/"off" or they become booleans.
- id: closing_time
  name: Closing time
  entities:
    switch.third_reality_inc_3rsp02064z_2: # Lamp switch (bedroom)
      state: "off"
    light.bedroom_hatch2: # Hatch (bedroom)
      state: "off"
    light.third_reality_inc_3rcb01057z_2: # Lamp (living room)
      state: "off"
    light.third_reality_inc_3rcb01057z_3: # Lamp (office)
      state: "off"

- id: evening_lights
  name: Evening lights
  entities:
    switch.third_reality_inc_3rsp02064z_2: # Lamp switch (bedroom)
      state: "on"
    light.bedroom_hatch2: # Hatch (bedroom)
      state: "on"
      brightness_pct: 30
      color_temp_kelvin: 2700
    light.third_reality_inc_3rcb01057z_2: # Lamp (living room)
      state: "on"
      brightness_pct: 30
      color_temp_kelvin: 2700
    light.third_reality_inc_3rcb01057z_3: # Lamp (office)
      state: "on"
      brightness_pct: 30
      color_temp_kelvin: 2700
