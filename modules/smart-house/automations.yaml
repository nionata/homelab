# Declarative automations, included from default.nix.
# HA parses YAML 1.1, so quote times or they become base-60 integers.
- id: evening_lights
  alias: Evening Lights
  trigger:
    - platform: sun
      event: sunset
      offset: "-00:45:00"
  action:
    - service: scene.turn_on
      target:
        entity_id: scene.evening_lights

- id: weekday_coffee
  alias: Weekday Coffee
  trigger:
    - platform: time
      at: "06:35:00"
  condition:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.third_reality_inc_3rsp02064z
    - delay:
        minutes: 10
    - service: switch.turn_off
      target:
        entity_id: switch.third_reality_inc_3rsp02064z

- id: hatch_alarm
  alias: Hatch Alarm
  triggers:
    - trigger: time
      at: "06:15:00"
  conditions:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
  actions:
    - action: light.turn_on
      target:
        entity_id: light.bedroom_hatch2
      data:
        transition: 300
        color_temp_kelvin: 2000
        brightness_pct: 100

- id: device_offline_alert
  alias: Device Offline Alert
  trigger:
    - platform: event
      event_type: state_changed
  condition:
    - condition: template
      value_template: >-
        {{ trigger.event.data.new_state is not none
           and trigger.event.data.new_state.state == 'unavailable'
           and (trigger.event.data.old_state is none
                or trigger.event.data.old_state.state != 'unavailable')
           and trigger.event.data.new_state.entity_id.split('.')[0] in [
             'light', 'switch', 'sensor', 'binary_sensor',
             'device_tracker', 'media_player', 'climate'
           ] }}
  action:
    - action: notify.send_message
      target:
        entity_id:
          - notify.nicks_iphone
          - notify.ciaras_iphone
      data:
        title: Device Offline
        message: "{{ trigger.event.data.new_state.name | default('Unknown device') }} is unavailable"
    - service: persistent_notification.create
      data:
        title: Device Offline
        message: "{{ trigger.event.data.new_state.name | default('Unknown device') }} is unavailable"
        notification_id: "offline_{{ trigger.event.data.new_state.entity_id | default('unknown') }}"

- id: weekend_coffee
  alias: Weekend Coffee
  trigger:
    - platform: time
      at: "07:00:00"
  condition:
    - condition: time
      weekday: [sat, sun]
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.third_reality_inc_3rsp02064z
    - delay:
        minutes: 10
    - service: switch.turn_off
      target:
        entity_id: switch.third_reality_inc_3rsp02064z

# SNZB-01M button (IEEE a4:c1:38:10:26:80:ff:ff). Device triggers match on the
# HA device_id, which only survives if .storage/core.device_registry does.
- id: "1794589161433"
  alias: Button - First button pressed
  triggers:
    - trigger: device
      domain: zha
      device_id: d719992b1f85e2af09603f3995b04c89
      type: remote_button_short_press
      subtype: button_1
  actions:
    - action: scene.turn_on
      target:
        entity_id: scene.evening_lights

- id: "1794589308665"
  alias: Button - Second button pressed
  triggers:
    - trigger: device
      domain: zha
      device_id: d719992b1f85e2af09603f3995b04c89
      type: remote_button_short_press
      subtype: button_2
  actions:
    - action: scene.turn_on
      target:
        entity_id: scene.closing_time
