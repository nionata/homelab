name: Build

on:
  pull_request:

jobs:
  nix-flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.5
      - run: nix fmt -- --ci
      - run: nix flake show --all-systems --no-update-lock-file
      - run: nix flake lock --no-update-lock-file

  nix-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.5
      - id: set-matrix
        run: |
          matrix="$(nix eval --json '.#githubActions.matrix')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  nix-build:
    name: ${{ matrix.name }} (${{ matrix.system }})
    needs: nix-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.5
      - id: nix-out
        run: |
          out=$(nix eval --raw '.#${{ matrix.attr }}')
          echo "hash=$(basename "$out" | cut -d- -f1)" >> "$GITHUB_OUTPUT"
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ matrix.attr }}-${{ steps.nix-out.outputs.hash }}
          restore-prefixes-first-match: nix-${{ matrix.attr }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ matrix.attr }}-
          purge-last-accessed: 604800
      - run: nix build -L '.#${{ matrix.attr }}'
