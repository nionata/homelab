name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.5
      - run: nix fmt -- --ci
      - run: nix flake show --all-systems
      - run: nix flake lock --no-update-lock-file

  nix-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.5
      - id: set-matrix
        run: |
          matrix="$(nix eval --json '.#githubActions.matrix')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }} (${{ matrix.system }})
    needs: nix-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.5
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ matrix.system }}-
          purge-last-accessed: 86400
      - run: nix build -L '.#${{ matrix.attr }}'
